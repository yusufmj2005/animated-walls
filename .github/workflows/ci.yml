name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Engine unit tests
        run: npm run test:engine

      - name: Build the development engine
        run: node scripts/build-engine.mjs --dev

      - name: Build samples
        run: npm run samples

      - name: TypeScript and engine integration tests
        run: npm run test:ts

      - name: Package an unpacked build
        run: npm run package:dir
